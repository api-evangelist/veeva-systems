security:
- SessionId: []
tags:
- name: Authentication
paths:
  /auth:
    post:
      tags:
      - Authentication
      summary: Authenticate using Vault user name and password
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
  /keep-alive:
    post:
      tags:
      - Authentication
      summary: Refresh an active session to extend its duration
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                type: object
  /session:
    delete:
      tags:
      - Authentication
      summary: End the authenticated user's API session
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                type: object
  /delegation/login:
    post:
      tags:
      - Authentication
      summary: Generate a delegated session ID for another user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                delegator_userid:
                  type: string
      responses:
        '200':
          description: Delegated session
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
