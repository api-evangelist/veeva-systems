openapi: 3.1.0
info:
  title: Veeva Vault Authentication API
  version: '26.1'
  description: Minimal OpenAPI for the Veeva Vault Platform REST API covering authentication, session management, version discovery, VQL queries, MDL execution, metadata components, Direct Data files, and delegated sessions.
